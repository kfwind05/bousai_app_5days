{% extends "base.html" %}

{% block content %}
<div class="panel map-panel">
  <div class="section-title">
    <span class="title-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21.5c4.2-4.2 7-7.6 7-11.2A7 7 0 0 0 5 10.3c0 3.6 2.8 7 7 11.2Z" fill="#1f7ce6"></path>
        <circle cx="12" cy="10.3" r="3.2" fill="#ffffff"></circle>
      </svg>
    </span>
    <span>避難所マップ</span>
  </div>
  <div class="map-box">
    <div id="shelterMap"></div>
  </div>
</div>

<div class="panel weather-panel">
  <div class="weather-header">
    <div class="weather-title">
      <span class="title-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3.4" fill="#f4b740"></circle>
          <g fill="#a4b9d2">
            <path d="M9.2 15.8a5.3 5.3 0 0 1 9.1-3.9 4.2 4.2 0 1 1-.8 8.1H9.2Z"></path>
            <path d="M4.6 16.1a4.1 4.1 0 0 1 3.2-6.8 4.2 4.2 0 0 1 6.8 4.1A4.4 4.4 0 0 1 4.6 16.1Z" opacity="0.75"></path>
          </g>
          <path d="M17.3 20.3h-9.5" stroke="#1f7ce6" stroke-width="1.8" stroke-linecap="round" opacity="0.9"></path>
          <path d="M9.5 20.5h7.2" stroke="#1f7ce6" stroke-width="1.8" stroke-linecap="round" opacity="0.9"></path>
        </svg>
      </span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <div class="auto-update">
      <span class="mark green" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
          <path d="M18.3 8.2A7.2 7.2 0 1 0 19.8 13h-2.2a5 5 0 1 1-1.7-4.4l1.4 1.1ZM12 7.4v5l3.7 2.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>10分おきに自動更新</span>
    </div>
  </div>

  <div class="weather-content" id="weatherContent">
    <div class="weather-row">
      <span class="mark blue" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
          <path d="M12 20.5c5.1-4.6 8.1-7.7 8.1-11.1A8.1 8.1 0 0 0 3.9 9.4c0 3.4 3 6.5 8.1 11.1Z" fill="currentColor"></path>
          <circle cx="12" cy="9.2" r="2.8" fill="#ffffff"></circle>
        </svg>
      </span>
      <span>青森市</span>
    </div>
    <div class="weather-status">
      <span class="mark green" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
          <path d="M5 12.6 9.3 16.9 19 7.2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>現在、警報・注意報は発表されていません</span>
    </div>
    <div class="weather-status sub">
      <span class="mark gray" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
          <path d="M12 5.5v5.9l4.5 2.1M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>データ取得: 2025年06月05日 11:56</span>
    </div>
    <div class="weather-status sub">
      <span class="mark gray" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
          <circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M12 8.5v4.2M12 15.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </span>
      <span>気象庁発表: 2025年06月04日 21:18</span>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const map = L.map('shelterMap', { zoomControl: true }).setView([40.8244, 140.7400], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    referrerPolicy: 'strict-origin-when-cross-origin'
  }).addTo(map);

  function renderNoWarning(areaName, lastFetchTime, reportTime) {
    const weatherContent = document.getElementById('weatherContent');
    if (!weatherContent) return;

    weatherContent.innerHTML = `
      <div class="weather-row">
        <span class="mark blue" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
            <path d="M12 20.5c5.1-4.6 8.1-7.7 8.1-11.1A8.1 8.1 0 0 0 3.9 9.4c0 3.4 3 6.5 8.1 11.1Z" fill="currentColor"></path>
            <circle cx="12" cy="9.2" r="2.8" fill="#ffffff"></circle>
          </svg>
        </span>
        <span>${areaName || '青森市'}</span>
      </div>
      <div class="weather-status">
        <span class="mark green" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
            <path d="M5 12.6 9.3 16.9 19 7.2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>現在、警報・注意報は発表されていません</span>
      </div>
      <div class="weather-status sub">
        <span class="mark gray" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
            <path d="M12 5.5v5.9l4.5 2.1M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>データ取得: ${lastFetchTime || '更新中...'}</span>
      </div>
      <div class="weather-status sub">
        <span class="mark gray" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
            <circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M12 8.5v4.2M12 15.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </span>
        <span>気象庁発表: ${reportTime || '不明'}</span>
      </div>
    `;
  }

  function updateWeatherContent(data) {
    const weatherContent = document.getElementById('weatherContent');
    if (!weatherContent) return;

    if (data && !data.error && data.warnings && data.warnings.length > 0) {
      weatherContent.innerHTML = `
        <div class="weather-row">
          <span class="mark blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
              <path d="M12 20.5c5.1-4.6 8.1-7.7 8.1-11.1A8.1 8.1 0 0 0 3.9 9.4c0 3.4 3 6.5 8.1 11.1Z" fill="currentColor"></path>
              <circle cx="12" cy="9.2" r="2.8" fill="#ffffff"></circle>
            </svg>
          </span>
          <span>${data.area_name || '青森市'}</span>
        </div>
        ${data.warnings.map(w => `
          <div class="weather-status">
            <span class="mark green" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
                <path d="M5 12.6 9.3 16.9 19 7.2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>${w.name}（${w.status}）</span>
          </div>
        `).join('')}
        <div class="weather-status sub">
          <span class="mark gray" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
              <path d="M12 5.5v5.9l4.5 2.1M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>データ取得: ${data.last_fetch_time || '更新中...'}</span>
        </div>
        <div class="weather-status sub">
          <span class="mark gray" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
              <circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
              <path d="M12 8.5v4.2M12 15.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
          </span>
          <span>気象庁発表: ${data.report_time || '不明'}</span>
        </div>
      `;
      return;
    }

    renderNoWarning(data && data.area_name ? data.area_name : '青森市', data && data.last_fetch_time ? data.last_fetch_time : '更新中...', data && data.report_time ? data.report_time : '不明');
  }

  function fetchWeatherWarnings() {
    fetch('/api/weather_warnings')
      .then(response => response.json())
      .then(data => updateWeatherContent(data))
      .catch(() => {
        renderNoWarning('青森市', '更新中...', '取得失敗');
      });
  }

  fetchWeatherWarnings();
  setInterval(fetchWeatherWarnings, 600000);
});
</script>
{% endblock %}
